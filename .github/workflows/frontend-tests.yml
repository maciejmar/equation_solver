name: Angular Frontend Tests

on:
  push:
    branches:
      - fix/equation-solver-stateless-matrix
    paths:
      - calkulator_frontend/**
      - .github/workflows/frontend-tests.yml
  pull_request:
    paths:
      - calkulator_frontend/**
      - .github/workflows/frontend-tests.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calkulator_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.17.1'
          cache: npm
          cache-dependency-path: calkulator_frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Angular tests
        shell: bash
        run: |
          set +e
          npm test -- --watch=false --browsers=ChromeHeadless > "$RUNNER_TEMP/angular-tests.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/angular-tests.log"
          cat "$RUNNER_TEMP/angular-tests.log" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then
            python -c 'import pathlib,sys; lines=pathlib.Path(sys.argv[1]).read_text().splitlines()[-12:]; message=" | ".join(lines).replace("%", "%25").replace("::", "%3A%3A"); print("::error title=Angular test failure details::" + message)' "$RUNNER_TEMP/angular-tests.log"
          fi
          exit "$result"
